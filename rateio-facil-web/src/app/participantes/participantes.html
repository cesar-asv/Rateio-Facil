<h1>Participantes da conta</h1>

<div class="card">
  <label>
    Descrição da conta
    <input type="text" [(ngModel)]="descricao" placeholder="Ex.: Churrasco" />
  </label>

  <h2>Cadastrar participante</h2>
  <div class="form-cadastro">
    <input type="text" [(ngModel)]="novoNome" placeholder="Nome" />
    <input type="email" [(ngModel)]="novoEmail" placeholder="Email" />
    <button type="button" [disabled]="carregando" (click)="cadastrarParticipante()">Cadastrar</button>
  </div>

  <h2>Selecionar participantes</h2>
  <p *ngIf="carregando && participantes.length === 0">Carregando participantes...</p>
  <p class="erro" *ngIf="!carregando && participantes.length === 0 && !erro">
    Nenhum participante cadastrado ainda.
  </p>

  <ul>
    <li *ngFor="let participante of participantes">
      <label>
        <input
          type="checkbox"
          [checked]="selecionados.has(participante.id)"
          (change)="alternar(participante)"
        />
        {{ participante.nome }} ({{ participante.email }})
      </label>
    </li>
  </ul>

  <p class="erro">{{ erro }}</p>
  <button type="button" [disabled]="carregando" (click)="continuar()">Continuar</button>
</div>
